name: npm publish to alpha

on:
  push:
    branches:
      - alpha

jobs:
  bump-version:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - run: npm version patch

      - run: |
          git push

  publish:
    needs: bump-version
    # Self-hosted: its IP is allow-listed in Cloudflare, so build:sdk's swagger
    # fetch reaches the real api-v2 (404 in prod -> committed swagger.json
    # fallback, which carries /user/blend) instead of a stale CDN 200 that
    # silently drops routes from the generated SDK.
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build --if-present
      # No --provenance: npm only accepts sigstore provenance from GitHub-hosted
      # runners (E422 on self-hosted). Running self-hosted is what lets build:sdk's
      # swagger fetch reach the Cloudflare-allow-listed api-v2, which matters more
      # than the provenance attestation.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ''
