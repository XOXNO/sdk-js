name: npm publish to alpha

on:
  push:
    branches:
      - alpha

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - run: npm version patch

      - run: |
          git push

  publish:
    needs: bump-version
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # build:sdk fetches prod /swagger.yaml, which sits behind Cloudflare. Its
      # per-edge cache can serve a stale spec to this runner even when origin is
      # fresh (dropping new routes from the generated SDK). A unique query per run
      # forces a cache miss so the build always regenerates from the live spec.
      - run: npm run build --if-present
        env:
          SWAGGER_URL: https://api.xoxno.com/swagger.yaml?ci=${{ github.run_id }}
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ''
